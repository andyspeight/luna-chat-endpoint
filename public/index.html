<!doctype html>
<html lang="en">

    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;

    font-weight: 650; font-size: 15px; padding: 12px 24px; border-radius: 12px;
    transition: background .15s;
  }
  .btn:hover { background: #E15940; }

    <div class="logo">Luna<span class="dot">.</span></div>
